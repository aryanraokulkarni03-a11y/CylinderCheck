name: Dispatch Alerts

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  dispatch-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dispatch-alerts monitor start
        continue-on-error: true
        env:
          HC_START_URL: ${{ secrets.HC_DISPATCH_ALERTS_START_URL }}
        run: |
          HC_START_URL=$(printf '%s' "$HC_START_URL" | tr -d '\r\n' | xargs)
          if [ -z "$HC_START_URL" ]; then exit 0; fi
          curl -fsS -m 15 "$HC_START_URL"

      - name: Invoke dispatch-alerts
        env:
          FUNCTIONS_BASE_URL: ${{ secrets.SUPABASE_FUNCTIONS_BASE_URL }}
          ALERTS_CRON_SECRET: ${{ secrets.SUPABASE_ALERTS_CRON_SECRET }}
        run: |
          FUNCTIONS_BASE_URL=$(printf '%s' "$FUNCTIONS_BASE_URL" | tr -d '\r\n' | xargs)
          ALERTS_CRON_SECRET=$(printf '%s' "$ALERTS_CRON_SECRET" | tr -d '\r\n' | xargs)

          test -n "$FUNCTIONS_BASE_URL"
          test -n "$ALERTS_CRON_SECRET"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            trigger_mode="manual"
          else
            trigger_mode="scheduled"
          fi

          payload=$(jq -n --arg triggerMode "$trigger_mode" '{triggerMode: $triggerMode}')

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${FUNCTIONS_BASE_URL}/dispatch-alerts" \
            -H "Authorization: Bearer ${ALERTS_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload")

          cat response.json

          test "$http_code" -ge 200
          test "$http_code" -lt 300
          jq -e '.ok == true and (.jobStatus == "succeeded" or .jobStatus == "partial")' response.json > /dev/null

      - name: Ping dispatch-alerts monitor success
        if: ${{ success() }}
        continue-on-error: true
        env:
          HC_SUCCESS_URL: ${{ secrets.HC_DISPATCH_ALERTS_SUCCESS_URL }}
        run: |
          HC_SUCCESS_URL=$(printf '%s' "$HC_SUCCESS_URL" | tr -d '\r\n' | xargs)
          if [ -z "$HC_SUCCESS_URL" ]; then exit 0; fi
          curl -fsS -m 15 "$HC_SUCCESS_URL"

      - name: Ping dispatch-alerts monitor failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          HC_FAIL_URL: ${{ secrets.HC_DISPATCH_ALERTS_FAIL_URL }}
        run: |
          HC_FAIL_URL=$(printf '%s' "$HC_FAIL_URL" | tr -d '\r\n' | xargs)
          if [ -z "$HC_FAIL_URL" ]; then exit 0; fi
          curl -fsS -m 15 "$HC_FAIL_URL"
