name: Scrape Prices

on:
  workflow_dispatch:

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Ping scrape-prices monitor start
        continue-on-error: true
        env:
          HC_START_URL: ${{ secrets.HC_SCRAPE_PRICES_START_URL }}
        run: |
          HC_START_URL=$(printf '%s' "$HC_START_URL" | tr -d '\r\n' | xargs)
          if [ -z "$HC_START_URL" ]; then exit 0; fi
          curl -fsS -m 15 "$HC_START_URL"

      - name: Invoke scrape-prices
        env:
          FUNCTIONS_BASE_URL: ${{ secrets.SUPABASE_FUNCTIONS_BASE_URL }}
          CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
        run: |
          FUNCTIONS_BASE_URL=$(printf '%s' "$FUNCTIONS_BASE_URL" | tr -d '\r\n' | xargs)
          CRON_SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | xargs)

          test -n "$FUNCTIONS_BASE_URL"
          test -n "$CRON_SECRET"

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${FUNCTIONS_BASE_URL}/scrape-prices" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"mode":"production","publish":true}')

          cat response.json

          test "$http_code" -ge 200
          test "$http_code" -lt 300
          jq -e '.ok == true or .success == true or .message != null' response.json > /dev/null

      - name: Ping scrape-prices monitor success
        if: ${{ success() }}
        continue-on-error: true
        env:
          HC_SUCCESS_URL: ${{ secrets.HC_SCRAPE_PRICES_SUCCESS_URL }}
        run: |
          HC_SUCCESS_URL=$(printf '%s' "$HC_SUCCESS_URL" | tr -d '\r\n' | xargs)
          if [ -z "$HC_SUCCESS_URL" ]; then exit 0; fi
          curl -fsS -m 15 "$HC_SUCCESS_URL"

      - name: Ping scrape-prices monitor failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          HC_FAIL_URL: ${{ secrets.HC_SCRAPE_PRICES_FAIL_URL }}
        run: |
          HC_FAIL_URL=$(printf '%s' "$HC_FAIL_URL" | tr -d '\r\n' | xargs)
          if [ -z "$HC_FAIL_URL" ]; then exit 0; fi
          curl -fsS -m 15 "$HC_FAIL_URL"
