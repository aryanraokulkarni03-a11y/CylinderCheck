    <script type="application/ld+json">
    {

      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I check if there is an LPG shortage in my area?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Enter your 6-digit PIN code on CylinderCheck to instantly see community shortage reports, delivery time estimates, and live alerts for your area. Free at cylindercheck.in."
          }
        },
        {
          "@type": "Question",
          "name": "When can I book my next LPG cylinder?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under government rules, you can rebook an LPG cylinder 25 days after your last booking date. CylinderCheck calculates your exact next booking window if you enter your last booking date."
          }
        },
        {
          "@type": "Question",
          "name": "How long does LPG cylinder delivery take in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LPG delivery times vary by area and distributor, typically ranging from 3 to 10 days. CylinderCheck shows area-specific delivery time estimates based on community data."

          "name": "What is the current LPG cylinder price in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "As of March 2025, a 14.2 kg domestic LPG cylinder is priced at ₹903 (IndianOil), ₹906 (HP Gas), and ₹901 (Bharat Gas) in Delhi. Prices are revised on the 1st of each month."

        }
